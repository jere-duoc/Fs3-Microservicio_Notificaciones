spring.application.name=Notificaciones

#Server Port
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/notificaciones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.notificaciones.register-health-indicator=true
resilience4j.circuitbreaker.instances.notificaciones.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificaciones.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificaciones.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.notificaciones.permitted-number-of-calls-in-half-open-state=3
