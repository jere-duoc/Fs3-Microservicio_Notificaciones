name: Publicar imagen docker ms-notificaciones

on:
  push:
    branches: 
      - aws

jobs:
  build-and-push: 
    runs-on: ubuntu-latest

    steps: 
      - name: Descargar Codigo fuente del Repo
        uses: actions/checkout@v4
        
      - name: Configurar Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Iniciar sesion en AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y Subir a Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/fs3/notificaciones:latest
            ${{ steps.login-ecr.outputs.registry }}/fs3/notificaciones:${{ github.sha }}